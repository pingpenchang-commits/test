.info-row { min-height: 34px; display: flex; align-items: center; } .info-row + .info-row { margin-top: 5px; } .info-link { display: block; width: 100%; color: #222222; text-decoration: none; font-size: 16px; font-weight: 700; line-height: 1.6; transition: color 0.2s ease, opacity 0.2s ease; } .info-link:hover { color: #003c9d; text-decoration: underline; } /* ========================= 按鈕 ========================= */ .buttons { display: flex; gap: 12px; margin: 0 18px 18px; } .button { flex: 1; min-height: 52px; display: flex; justify-content: center; align-items: center; border-radius: 8px; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 700; transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease; } .button:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); } .button:active { transform: scale(0.98); } .line-button { background: #0044BB; } .website-button { background: #003C9D; } /* ========================= Footer ========================= */ .footer { min-height: 65px; display: flex; align-items: center; border-top: 1px solid #dddddd; padding: 5px 16px; gap: 10px; } /* Facebook */ .facebook { width: 45px; height: 50px; display: flex; align-items: center; justify-content: flex-start; } .facebook img { width: 32px; height: 32px; object-fit: contain; } /* 分享 */ .share { flex: 1; border: 0; background: transparent; padding: 8px; display: flex; align-items: center; justify-content: flex-start; gap: 6px; cursor: pointer; color: #222222; font-family: inherit; font-size: 15px; font-weight: 700; } .share img { width: 24px; height: 24px; object-fit: contain; } .share:hover { opacity: 0.7; } /* Footer Logo */ .footer-logo { width: 120px; height: 55px; display: flex; justify-content: flex-end; align-items: center; } .footer-logo img { width: 100px; max-height: 45px; object-fit: contain; } /* ========================= 分享提示 ========================= */ .toast { position: fixed; left: 50%; bottom </div> <!-- ================================= 分享提示 ================================= --> <div id="toast" class="toast" > 網址已複製！ </div> <!-- ================================= JavaScript ================================= --> <script> async function sharePage() { const shareData = { title: "吳勝雄｜清水三久行", text: "清水三久行｜吳勝雄", url: window.location.href }; /* 手機原生分享 */ if ( navigator.share && /Android|iPhone|iPad|iPod/i.test( navigator.userAgent ) ) { try { await navigator.share(shareData); } catch (error) { console.log("使用者取消分享"); } return; } /* 電腦或不支援原生分享 */ try { await navigator.clipboard.writeText( window.location.href ); showToast( "網址已複製，可以分享給朋友！" ); } catch (error) { /* Clipboard API 不支援時 */ const textarea = document.createElement("textarea"); textarea.value = window.location.href; document.body.appendChild( textarea ); textarea.select(); document.execCommand( "copy" ); document.body.removeChild( textarea ); showToast( "網址已複製，可以分享給朋友！" ); } } /* Toast */ function showToast(message) { const toast = document.getElementById("toast"); toast.textContent = message; toast.classList.add( "show" ); setTimeout( function () { toast.classList.remove( "show" ); }, 2500 ); } </script> </body> </html>
