<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的一頁式網站</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* 首頁 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            background: #f5f5f5;
            padding: 40px 20px;
        }

        .hero img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        /* 按鈕 */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0056b3;
        }

        /* 內容區 */
        .section {
            padding: 80px 20px;
            text-align: center;
        }

        .section h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- 首頁 -->
    <section class="hero">

        <!-- 圖片 -->
        <img src="https://i.ibb.co/qMZQw2rB/logo.jpg" alt="網站主圖片">

        <h1>我的一頁式網站</h1>

        <p>
            歡迎來到我的網站！
        </p>

        <!-- 按鈕 -->
        <a href="#about" class="btn">
            了解更多
        </a>

    </section>


    <!-- 關於我們 -->
    <section id="about" class="section">

        <h2>關於我們</h2>

        <p>
            這裡可以放置你的網站介紹、個人介紹或公司資訊。
        </p>

    </section>

</body>
</html>
