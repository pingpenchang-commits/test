<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的一頁式網站</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* 首頁 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;

            background: #f5f5f5;
            padding: 0px 0px;
        }
        
        .hero img {
            width: 400px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0 30px 0;
            border-radius: 8px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        /* 按鈕 */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0056b3;
        }

        /* 內容區 */
        .section {
            padding: 10px 10px;
            text-align: center;
        }

        .section h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- 首頁 -->
    <section class="hero">

        <!-- 圖片 -->
        <img src="https://i.ibb.co/qMZQw2rB/logo.jpg" alt="網站主圖片">

        <!-- 按鈕 -->
       <div class="btn-group">
           <a href="https://i.ibb.co/qMZQw2rB/logo.jpg" class="btn">
               三久特色
           </a>

           <a href="https://i.ibb.co/qMZQw2rB/logo.jpg" class="btn">
               機台選購
           </a>

           <a href="https://i.ibb.co/qMZQw2rB/logo.jpg" class="btn">
               安裝實例
           </a>
           
       </div>
        
    <!-- 內容區 -->
    <section class="section">

        <img src="https://i.ibb.co/kVW2Pw5Z/image.jpg" alt="三久特色">

    </section>

</body>
</html>
