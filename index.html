</div> <!-- ================================= 分享提示 ================================= --> <div id="toast" class="toast" > 網址已複製！ </div> <!-- ================================= JavaScript ================================= --> <script> async function sharePage() { const shareData = { title: "吳勝雄｜清水三久行", text: "清水三久行｜吳勝雄", url: window.location.href }; /* 手機原生分享 */ if ( navigator.share && /Android|iPhone|iPad|iPod/i.test( navigator.userAgent ) ) { try { await navigator.share(shareData); } catch (error) { console.log("使用者取消分享"); } return; } /* 電腦或不支援原生分享 */ try { await navigator.clipboard.writeText( window.location.href ); showToast( "網址已複製，可以分享給朋友！" ); } catch (error) { /* Clipboard API 不支援時 */ const textarea = document.createElement("textarea"); textarea.value = window.location.href; document.body.appendChild( textarea ); textarea.select(); document.execCommand( "copy" ); document.body.removeChild( textarea ); showToast( "網址已複製，可以分享給朋友！" ); } } /* Toast */ function showToast(message) { const toast = document.getElementById("toast"); toast.textContent = message; toast.classList.add( "show" ); setTimeout( function () { toast.classList.remove( "show" ); }, 2500 ); } </script> </body> </html>
