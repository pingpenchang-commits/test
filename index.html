/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    background: #eeeeee;

    font-family:
        Arial,
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

    color: #000000;

}


/* =========================================================
   主畫面
========================================================= */

.page {

    width: 100%;

    max-width: 500px;

    margin: 0 auto;

    background: #ffffff;

    min-height: 100vh;

}


/* =========================================================
   HERO
   對應 Flex hero

   aspectRatio = 60:11
   size = full
   aspectMode = cover
========================================================= */

.hero {

    width: 100%;

    aspect-ratio: 60 / 11;

    overflow: hidden;

    background: #ffffff;

}

.hero img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;

}


/* =========================================================
   BODY
========================================================= */

.body {

    width: 100%;

    background: #ffffff;

}


/* =========================================================
   姓名

   Flex:
   borderWidth: bold
   height: 100px
========================================================= */

.name-box {

    width: 100%;

    height: 100px;

    border: 3px solid #000000;

    background: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}

.name {

    font-size: 32px;

    font-weight: bold;

    color: #000000;

    text-align: center;

    line-height: 1;

    transform:
        translateY(8px);

}


/* =========================================================
   公司資訊

   Flex:
   backgroundColor #CCEEFF
   borderWidth 10px

========================================================= */

.company-box {

    width: 100%;

    background: #CCEEFF;

    border: 10px solid #CCEEFF;

    border-radius: 10px;

    overflow: hidden;

}


/* =========================================================
   公司 Logo + 公司名稱

   Flex:
   horizontal
   height 30px
========================================================= */

.company-header {

    height: 30px;

    display: flex;

    flex-direction: row;

    align-items: center;

}


/* Logo */

.company-logo {

    height: 30px;

    object-position: left center;

/* 公司名稱 */

.company-name {

    font-size: 16px;

    font-weight: bold;

    line-height: 30px;

    transform:

/* =========================================================
   分隔線

   height 20px

    height: 20px;

    display: flex;

    align-items: center;

.separator {

    height: 1px;

    background: #FFFFFF;

   電話

   第三：
   height 20px
========================================================= */

    align-items: center;

.phone-box.phone-1 {

    height: 30px;

}

.phone-box.phone-2 {

    height: 30px;

}

.phone-box.phone-3 {

    height: 20px;

.phone {

    text-decoration: none;

    font-size: 15px;

    font-weight: bold;

    line-height: 1;

    display: block;

/* =========================================================
   聯絡按鈕

========================================================= */

.button-area {

    display: flex;

    align-items: center;

    gap: 10px;

    padding-top: 8px;

    padding-bottom: 10px;

========================================================= */

    color: #ffffff;

    font-size: 14px;

    font-weight: bold;

    display: flex;

    align-items: center;

    justify-content: center;

    text-decoration: none;

/* 原本：

    align-items: center;

/* =========================================================
   防止手機點擊出現奇怪反白

* {

/* =========================================================
   分享功能

   與原本功能相同
========================================================= */

async function shareCard() {

    try {


        /* 初始化 LIFF */

        await liff.init({

            liffId: LIFF_ID

        });


        /* 尚未登入 */

        if (!liff.isLoggedIn()) {

            liff.login();

            return;

        }


        /* 開啟 LINE 分享對象選擇器 */

        const result =
            await liff.shareTargetPicker([
                flexMessage
            ]);


        /* 分享成功 */

        if (result) {

            alert(
                "電子名片分享成功！"
            );

        }


    }

    catch (error) {

        console.error(
            "LIFF 錯誤：",
            error
        );


        alert(
            "LINE 分享發生錯誤。\n\n" +
            "請確認您是從 LINE App 開啟此電子名片。"
        );

    }

}
